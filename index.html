<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Andreas Pathfinder 3D - GPS Route Planner</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- App CSS -->
  <link rel="stylesheet" href="css/style.css?v=4.1">
</head>
<body>

  <!-- Fullscreen Map -->
  <div id="map"></div>

  <!-- Floating Navigation Panel -->
  <aside class="floating-panel">
    <div class="panel-header">
      <div class="brand">
        <span class="brand-icon">🧭</span>
        <div>
          <h1>San Andreas Pathfinder</h1>
        </div>
      </div>
      <span class="badge">3D A* Engine</span>
    </div>

    <div class="panel-body">
      <!-- Network Scope Selector -->
      <div style="display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #94a3b8;">
        <span>Road Network:</span>
        <select id="select-scope" style="background: #1e293b; color: #f8fafc; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; padding: 4px 8px; font-size: 12px; outline: none; cursor: pointer;">
          <option value="all" selected>All San Andreas (28,991 nodes)</option>
          <option value="sf">San Fierro (6,217 nodes)</option>
        </select>
      </div>

      <!-- Dynamic Waypoints List (A, B, C...) -->
      <div id="waypoints-container" class="point-inputs">
        <div class="instruction-hint" style="margin: 0; width: 100%;">
          Click on the map to set Point <strong>A</strong>, <strong>B</strong>, <strong>C</strong>...
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="btn-reverse" class="btn btn-secondary" title="Reverse route direction">
          🔄 Reverse
        </button>
        <button id="btn-clear" class="btn btn-secondary" title="Clear all waypoints">
          🗑️ Clear
        </button>
        <button id="btn-focus-all" class="btn btn-primary" title="Fit whole state map">
          🗺️ Center
        </button>
      </div>

      <!-- Results and Route Breakdown -->
      <div id="routes-list" class="routes-container">
        <div class="instruction-hint">
          💡 You can add multiple waypoints (<strong>A ➔ B ➔ C ➔ D...</strong>).
          <br><br>
          <em>Drag markers on the map to dynamically recalculate the route.</em>
        </div>
      </div>

      <!-- Debug Controls -->
      <div class="debug-toggle">
        <label for="toggle-debug" style="cursor: pointer;">Show road network nodes</label>
        <input type="checkbox" id="toggle-debug" style="cursor: pointer;">
      </div>
    </div>
  </aside>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Application Modules -->
  <script src="js/map-config.js?v=4.0"></script>
  <script src="js/elevation-cost.js?v=4.0"></script>
  <script src="js/pathfinder.js?v=4.0"></script>
  <script src="js/app.js?v=4.0"></script>
</body>
</html>
