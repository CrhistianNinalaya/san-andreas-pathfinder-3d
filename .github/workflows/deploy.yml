name: CI & Deploy to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-deploy:
    name: Test, Validate & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: 📂 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗺️ Verify Graph Invariants
        run: pnpm run verify-graph

      - name: 🧪 Run Vitest Test Suite
        run: pnpm test

      - name: 🔍 TypeScript Typecheck
        run: pnpm run typecheck

      - name: 🏗️ Production Build
        run: pnpm run build

      - name: 🚀 Deploy to Vercel (Manual Trigger Only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@latest deploy --prod --token="${{ secrets.VERCEL_TOKEN }}" --yes
